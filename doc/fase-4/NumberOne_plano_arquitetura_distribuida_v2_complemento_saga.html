/* Hierarquia visual consistente com a primeira apresentação */
.sectionhead{border-bottom-color:var(--line);background:var(--panel-alt)}
.sectionhead.heading-sequence{background:rgba(36,107,219,.15);border-bottom:1px solid rgba(36,107,219,.29);border-left:5px solid #246bdb}
.sectionhead.heading-rules{background:rgba(20,160,90,.14);border-bottom:1px solid rgba(20,160,90,.28);border-left:5px solid #14a05a}
.sectionhead.heading-decisions{background:rgba(121,82,214,.15);border-bottom:1px solid rgba(121,82,214,.30);border-left:5px solid #7952d6}
.sectionhead.heading-notes{background:rgba(100,116,139,.13);border-bottom:1px solid rgba(100,116,139,.27);border-left:5px solid #64748b}
.sectionhead.heading-contracts{background:rgba(237,138,33,.13);border-bottom:1px solid rgba(237,138,33,.28);border-left:5px solid #ed8a21}
.sectionhead h2{font-weight:800;font-size:14px}
@media(max-width:720px){.topactions{gap:4px}.topactions button{font-size:10px;padding:7px}}

/* Destaques de mudança de contrato e mapa de estados */
.contract.contract-change{border-color:rgba(230,174,45,.65);background:rgba(231,180,48,.055)}
.contract.contract-change summary{background:rgba(231,180,48,.10)}
.contract-change .contractpath{color:var(--txt)}
.tag.change{background:rgba(245,183,40,.16);border-color:rgba(227,176,44,.55);color:#e6ae3a}
body[data-theme="light"] .tag.change{color:#91620a}
.status-picker{display:flex;flex-wrap:wrap;gap:8px}
.status-picker button{font-weight:680}
.status-picker button.selected{border-color:var(--state-accent);background:color-mix(in srgb,var(--state-accent) 13%,transparent);color:var(--txt)}
.status-track{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0 5px}
.status-node{background:color-mix(in srgb,var(--state-accent) 13%,var(--panel));border:1px solid var(--state-accent);border-radius:9px;padding:12px 14px;font-size:12px;font-weight:750;white-space:nowrap}
.status-arrow{color:var(--muted);font-size:17px}
.status-alt{border-left:3px solid #e2a338;border-radius:6px;padding:10px 13px;background:var(--panel-alt);margin-top:16px;color:var(--muted);font-size:12px}
.status-chip{display:inline-block;background:var(--panel-alt);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font:11px ui-monospace,monospace}
.status-compact{font-size:11px;color:var(--muted);margin-top:11px}
@media(max-width:720px){.status-track{gap:5px}.status-node{font-size:10px;padding:9px}.status-arrow{font-size:12px}}

/* Classificação contratual auditável: novo em azul, alterado em amarelo */
.contract.contract-new{border-color:rgba(59,130,246,.62);background:rgba(37,99,235,.045)}
.contract.contract-new summary{background:rgba(37,99,235,.12)}
.tag.change-new{background:rgba(37,99,235,.17);border-color:rgba(59,130,246,.55);color:#83b6ff}
body[data-theme="light"] .tag.change-new{color:#164c9e}
.contract.contract-changed{border-color:rgba(230,174,45,.66);background:rgba(231,180,48,.05)}
.contract.contract-changed summary{background:rgba(231,180,48,.10)}
.tag.change-changed{background:rgba(245,183,40,.16);border-color:rgba(227,176,44,.55);color:#e6ae3a}
body[data-theme="light"] .tag.change-changed{color:#91620a}
.change-explanation{border-left:3px solid #d5a32c;background:rgba(231,180,48,.065);border-radius:5px;padding:10px 12px;margin-top:9px;font-size:12px;line-height:1.5}
.change-explanation.new{border-left-color:#3b82f6;background:rgba(37,99,235,.06)}

/* Catálogo de nomenclatura — reutiliza variáveis e componentes do tema atual */
.naming-tabs{display:flex;flex-wrap:wrap;gap:8px}
.naming-tab{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:650}
.naming-tab.selected{border-color:var(--name-accent);background:color-mix(in srgb,var(--name-accent) 12%,transparent);color:var(--txt)}
.naming-card{border:1px solid var(--line);background:var(--panel-alt);border-radius:11px;padding:16px;display:grid;gap:9px}
.naming-card + .naming-card{margin-top:10px}
.naming-top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.naming-value{font:600 13px/1.5 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
.naming-meta{font-size:11px;color:var(--muted);line-height:1.6}
.naming-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.naming-status{font-size:10px;font-weight:750;border-radius:99px;padding:4px 8px;background:rgba(237,138,33,.12);color:#d99534}
.naming-status.approved{background:rgba(20,160,90,.12);color:#21b77b}
.naming-field{display:grid;gap:8px}
.naming-summary{display:flex;gap:12px;flex-wrap:wrap}
.naming-summary .tile{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:11px 15px;min-width:135px}
.naming-summary .tile strong{display:block;font-size:22px;margin-top:3px}
@media(max-width:720px){.naming-card{padding:12px}}

/* Repositórios da Fase 4 — adição isolada */
.repo-tabs{display:flex;gap:7px;flex-wrap:wrap}.repo-tab.selected{background:rgba(59,130,246,.14);border-color:#3b82f6;color:var(--txt)}
.repo-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.repo-fullname{font-size:16px;word-break:break-word}.repo-url{font-size:12px;color:#60a5fa}.repo-availability{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--muted)}
.repo-summary{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 10px}.repo-summary>span{font-size:11px;border:1px solid var(--line);padding:6px 9px;border-radius:7px;color:var(--muted)}.repo-actionline{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.repo-grid{display:grid;gap:9px}.repo-resource{border:1px solid var(--line);border-left:3px solid var(--impact);border-radius:9px;padding:13px;background:var(--panel-alt)}.repo-resource-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.repo-resource-top strong{font-size:13px;line-height:1.5}.repo-resource-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-top:7px}.repo-impact{font-size:10px;font-weight:700;white-space:nowrap;padding:4px 8px;color:var(--impact);border:1px solid var(--impact);background:color-mix(in srgb,var(--impact) 11%,transparent);border-radius:6px}
.repo-resource-actions{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-top:11px}.repo-resource-actions .small{font-size:11px}.danger-link{color:#f87171!important}.repo-inline-editor{display:grid;gap:9px;padding:12px;margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.repo-inline-editor .fieldinput{width:100%;box-sizing:border-box}.repo-editor-buttons{display:flex;justify-content:flex-end;gap:8px}
@media(max-width:600px){.repo-resource-top{flex-wrap:wrap}.repo-actionline{justify-content:flex-start}}

/* Documentação de arquitetura: tabelas com leitura direta e sem navegação interna */
.doc-table-scroll{overflow-x:auto;width:100%;border:1px solid var(--line);border-radius:11px;margin-top:8px}
.doc-table{width:100%;border-collapse:collapse;table-layout:auto;font-size:12.5px;line-height:1.55}
.doc-table th{background:var(--panel-alt);color:var(--muted);text-align:left;padding:11px 14px;font-size:11px;letter-spacing:.2px;white-space:nowrap}
.doc-table td{padding:11px 14px;vertical-align:top;border-top:1px solid var(--line)}
.doc-table td:first-child{min-width:155px}.doc-table code{font-size:11.5px;white-space:normal;overflow-wrap:anywhere}
.doc-repo-header{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:12px}
.doc-repo-header span{color:var(--muted)}.doc-warning{margin-bottom:18px;font-size:12.5px}
.doc-footnote{margin-top:12px}.doc-scope-ucs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:16px}
.doc-subhead{font-size:13px;margin:19px 0 7px}.doc-uc-link{padding:3px 7px;font-size:11px}
@media(max-width:640px){.doc-table{font-size:11.5px}.doc-table td,.doc-table th{padding:9px 10px}}
.platform-tag{white-space:nowrap;font-size:11px;font-weight:700}.platform-novo{color:#60a5fa;background:rgba(37,99,235,.12);border-color:rgba(37,99,235,.35)}.platform-modificado{color:#e6b856;background:rgba(217,162,40,.12);border-color:rgba(217,162,40,.35)}.platform-transferido{color:#b49afa;background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.35)}

.saga-contracts {line-height:1.55}
.saga-contracts h3 {margin:1.7rem 0 .55rem; scroll-margin-top:5rem}
.saga-contracts h4 {margin:1.2rem 0 .55rem}
.saga-contracts p, .saga-contracts ul {margin:.65rem 0 .9rem}
.saga-contracts li+li {margin-top:.3rem}
.saga-contracts .doc-table-scroll {margin:.8rem 0 1.2rem}
.saga-contracts .doc-table {min-width:640px}
.saga-contracts .doc-table td {vertical-align:top}
.saga-contracts a {color:var(--txt);text-decoration:underline;text-underline-offset:.18em}
.saga-contracts nav ul {display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));column-gap:1.25rem;row-gap:.35rem}
.saga-contracts nav li+li {margin:0}

<template id="saga-contract-supplement"><div class="sectionbody saga-contracts"><p class="note"><strong>Atualização de 07/11/2026.</strong> As <a href="orientacoes-implementacao-equipe.md">orientações de implementação da equipe</a> fecham as decisões por delegação de Matheus e orientam a próxima revisão dos schemas/OpenAPI.</p><p>Definição técnica validada por Matheus em 04/11/2026 para orientar a implementação da OS. Os alinhamentos com os outros serviços estão na seção 7. A referência é <code>NumberOne_plano_arquitetura_distribuida_v2.html</code>, seções Saga, Estados e transições, Nomenclatura e casos UC-04 a UC-10. Os IDs <code>EV-xx</code>, <code>CT-xx</code> e <code>Dxx</code> remetem ao HTML. Esta revisão incorpora o fechamento <code>CLOSED</code> no Inventory e define o DynamoDB para o histórico de revisões veiculares. A janela de compensação automática adotada como base é o cancelamento integral antes do primeiro início confirmado, com verificação de não uso dos materiais.</p><nav aria-label="Seções dos contratos da Saga"><ul><li><a href="#saga-contratos-1">1. Mensagens SQS por microsserviço</a></li><li><a href="#saga-contratos-2">2. Envelope v1 e exemplos</a></li><li><a href="#saga-contratos-3">3. Inbox, outbox e recuperação</a></li><li><a href="#saga-contratos-4">4. Máquina de estados da Saga na OS</a></li><li><a href="#saga-contratos-5">5. Compensação proposta · C1–C6</a></li><li><a href="#saga-contratos-6">6. Persistência por microsserviço</a></li><li><a href="#saga-contratos-7">7. Alinhamentos com a equipe</a></li></ul></nav><h3 id="saga-contratos-1">1. Mensagens SQS por microsserviço</h3>
<p>Fila principal <code>numberone-billing-events</code> e DLQ <code>numberone-billing-events-dlq</code>, nomes propostos em NM-015 e NM-016. Um produtor e um consumidor de negócio. O tipo da fila e os parâmetros de retry ficam com Marcelo. O contrato trata reentregas e mensagens fora de ordem. <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues-at-least-once-delivery.html">Entrega pelo menos uma vez em filas Standard</a></p>
<div class="doc-table-scroll"><table class="doc-table"><thead><tr><th scope="col">Serviço</th><th scope="col">Publica no SQS</th><th scope="col">Consome do SQS</th><th scope="col">Controle local</th></tr></thead><tbody><tr><td>Billing</td><td>EV-01, EV-02, EV-02B, EV-03 e EV-04 conforme adoção abaixo.</td><td>Nenhuma mensagem desta Saga. Webhook do Mercado Pago chega por HTTPS.</td><td>Outbox de eventos e deduplicação/reconciliação de webhooks.</td></tr><tr><td>OS</td><td>Nenhuma mensagem desta Saga.</td><td>Eventos de orçamento e pagamento da fila Billing → OS.</td><td>Inbox, registro das operações REST e outbox local para projetar o histórico no DynamoDB.</td></tr><tr><td>Inventory</td><td>Nenhuma mensagem desta Saga.</td><td>Nenhuma mensagem desta Saga.</td><td>Registro idempotente das operações REST e de seus efeitos sobre o saldo.</td></tr></tbody></table></div>
<div class="doc-table-scroll"><table class="doc-table"><thead><tr><th scope="col">ID</th><th scope="col"><code>eventType</code></th><th scope="col">Quando Billing grava o evento</th><th scope="col">O que a OS faz</th><th scope="col">Situação no HTML</th></tr></thead><tbody><tr><td>EV-01</td><td><code>OrcamentoEnviado</code></td><td>Transição comercial para <code>SENT</code> quando a revisão estiver disponível para aprovação, conforme alinhamento com Billing.</td><td>Vincula orçamento/revisão elegível e leva a Saga a <code>WAITING_APPROVAL</code>.</td><td>Previsto na v1. Julio valida o ponto exato de publicação em D09/P13.</td></tr><tr><td>EV-02</td><td><code>OrcamentoAprovado</code></td><td>Aprovação integral confirmada e snapshot comercial persistido.</td><td>Registra aprovação vigente, OS <code>APPROVED</code> e Saga <code>READY_FOR_EXECUTION</code>.</td><td>Conceito no fluxo. Payload a validar.</td></tr><tr><td>EV-02B</td><td><code>OrcamentoRejeitado</code></td><td>Rejeição integral confirmada.</td><td>Registra rejeição vigente, OS <code>REJECTED</code> e Saga <code>WAITING_REVISION</code>.</td><td>Conceito no fluxo. Payload a validar.</td></tr><tr><td>EV-03</td><td><code>PagamentoConfirmado</code></td><td>Pagamento passa para <code>PAID</code> após confirmação validada pelo Billing.</td><td>Atualiza projeção por pagamento. Pode solicitar atualização da quitação.</td><td>Conceito no fluxo. Payload a validar.</td></tr><tr><td>EV-04</td><td><code>PagamentoAtualizado</code></td><td>Proposta inicial: estorno integral efetivamente confirmado, <code>REFUNDED</code>.</td><td>Atualiza projeção e reavalia quitação antes de exibir prontidão para entrega.</td><td>Entra na v1 se o Billing incluir estorno integral. Estorno parcial e outros estados exigem contrato próprio ou extensão acordada.</td></tr></tbody></table></div>
<p>Diagnóstico, execução e conclusão técnica são ações locais da OS. Consumo, reversão de estoque e cancelamento de orçamento usam CT-05/08/08B/09 por REST. O resultado desses contratos é a confirmação da etapa de compensação na OS. Estorno financeiro continua sob responsabilidade do Billing, e seu reflexo assíncrono seria EV-04 se adotado.</p>
<h3 id="saga-contratos-2">2. Envelope v1 e exemplos</h3>
<p>O corpo de cada mensagem SQS é <strong>um objeto JSON</strong>, codificado em UTF-8. Os seis campos abaixo são obrigatórios. <code>payload</code> é específico por tipo.</p>
<div class="doc-table-scroll"><table class="doc-table"><thead><tr><th scope="col">Campo</th><th scope="col">Formato e regra</th></tr></thead><tbody><tr><td><code>eventId</code></td><td>UUID exclusivo de um fato emitido. Retry, reentrega e redrive do mesmo fato preservam ID e conteúdo.</td></tr><tr><td><code>eventType</code></td><td>Nome exato da matriz.</td></tr><tr><td><code>schemaVersion</code></td><td>Inteiro <code>1</code>. Identifica a estrutura do evento.</td></tr><tr><td><code>occurredAt</code></td><td>Data/hora RFC 3339 em UTC. Serve para auditoria.</td></tr><tr><td><code>correlationId</code></td><td>UUID de correlação propagado na origem e usado nos logs.</td></tr><tr><td><code>payload</code></td><td>Objeto com referências e dados de negócio. <code>serviceOrderId</code> é a chave de associação à Saga na OS.</td></tr></tbody></table></div>
<p>Os IDs de entidades são UUIDs. Proposta para <code>budgetVersion</code>: revisão comercial inteira positiva, crescente <strong>por OS</strong> e estável entre envio e decisão da mesma revisão. <code>paymentVersion</code>: versão inteira positiva, crescente <strong>por paymentId</strong> a cada alteração publicada. <code>sagaId</code> permanece interno à OS nesta versão. Valores monetários usam string decimal com duas casas, com <code>currency</code> no evento de aprovação como complemento proposto ao HTML. Os eventos carregam referências e fatos, sem CPF, contato do cliente, QR Code, segredos ou dados de cartão.</p>

<h4>Ordem e validade de negócio</h4>
<ul><li>Orçamento: use revisão, identidade e transição. <code>SENT</code> atrasado da mesma revisão após decisão é ignorado. Uma revisão inferior é obsoleta. Mesma revisão com outro <code>budgetId</code> ou duas decisões divergentes exige reconciliação. Billing deve serializar as decisões e emitir eventos apenas para transições comerciais válidas.</li><li>Se EV-02/02B chegar antes do EV-01 e faltar contexto para validar a revisão, a OS mantém a mensagem pendente e tenta novamente. O cenário deve constar nos testes. Se EV-01 não for adotado, a equipe precisa fechar outra fonte para identificar o orçamento vigente e permitir a transição.</li><li>Pagamento: aplicar a versão mais nova de cada <code>paymentId</code>, inclusive se EV-04 chegar antes de EV-03. Um <code>PAID</code> anterior não desfaz <code>REFUNDED</code>. O estado financeiro da OS é apurado pelo Billing via CT-07, considerando todos os pagamentos válidos.</li><li>Guardas da OS valem após a deduplicação: nenhum evento de orçamento reabre OS/Saga em cancelamento ou encerrada. Eventos financeiros posteriores à entrega podem atualizar a projeção e gerar revisão operacional conforme política do Billing. A entrega registrada é preservada para auditoria.</li></ul>
<h3 id="saga-contratos-3">3. Inbox, outbox e recuperação</h3>
<p><strong>Billing · outbox.</strong> Na mesma transação PostgreSQL, persistir a transição do orçamento/pagamento e inserir o evento em <code>outbox_event</code>. Guardar <code>event_id</code> único, tipo, versão do schema, ID/revisão de negócio, envelope completo, status, contagem de tentativas, próxima tentativa, prazo de posse, último erro e data de publicação. Estados propostos: <code>PENDING</code>, <code>PUBLISHED</code> e <code>NEEDS_REVIEW</code> quando o retry operacional se esgotar.</p>
<p>Um worker adquire um lote com posse temporária em transação curta, envia ao SQS fora da transação e marca <code>PUBLISHED</code> após aceite, se ainda tiver a posse. Se enviar e cair antes de marcar, outro ciclo reenvia o mesmo envelope com o mesmo <code>eventId</code>. Falha de publicação fica na outbox com alerta e recuperação pelo Billing. <a href="https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/transactional-outbox.html">Transactional outbox na AWS</a></p>
<p><strong>OS · inbox.</strong> Validar envelope e schema, abrir transação e deduplicar por <code>event_id</code> único. Serializar as transições da mesma OS por lock ou versão com retry. Salvar inbox, projeção, transição e qualquer tarefa local decorrente no mesmo commit. Guardar <code>event_id</code>, tipo, schema, <code>service_order_id</code>, <code>correlation_id</code>, hash do envelope, desfecho <code>APPLIED</code> ou <code>IGNORED_STALE</code> e data. Mesmo ID com outro conteúdo é erro de contrato. Duplicata idêntica usa o desfecho já registrado.</p>
<p>O consumidor confirma o SQS após o commit. Se a aplicação cair entre commit e confirmação, a reentrega encontra o evento registrado e confirma sem reaplicar. Se faltar contexto, o commit do processamento é revertido e a mensagem volta para retry. Schema inválido, conflito de dados ou falha persistente seguem a política de DLQ com diagnóstico e redrive preservando o ID. Ajustar visibilidade, limite de recebimentos, alarmes, retenção da DLQ e retenção da inbox ao período de reprocessamento acordado. <a href="https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html">DLQ e redrive no SQS</a></p>
<p><strong>OS · operações REST.</strong> Registrar a intenção e o identificador estável antes do HTTP. Um worker retoma operações pendentes após reinício. A resposta é aplicada em outra transação, revalidando versão e cancelamento. Tratar timeout como <code>AWAITING_RESULT</code>. Na integração REST, quem recebe persiste chave, hash do pedido, resultado e efeito na mesma transação local. Repetição com o mesmo conteúdo devolve o resultado registrado e uso da mesma chave com conteúdo diferente retorna conflito. A chamada HTTP fica fora dos locks/transações locais.</p>
<h3 id="saga-contratos-4">4. Máquina de estados da Saga na OS</h3>
<p>Uma Saga por ordem, criada com a abertura. <code>IN_DIAGNOSIS</code> é a etapa técnica inicial, inclusive enquanto a OS comercial ainda está <code>RECEIVED</code>. O diagnóstico e o andamento do item continuam sob as regras da OS.</p>
<div class="doc-table-scroll"><table class="doc-table"><thead><tr><th scope="col">Estado técnico</th><th scope="col">Entrada, ação e próxima transição</th></tr></thead><tbody><tr><td><code>IN_DIAGNOSIS</code></td><td>OS aberta, aguarda diagnóstico e envio do orçamento. EV-01 válido leva a <code>WAITING_APPROVAL</code>.</td></tr><tr><td><code>WAITING_APPROVAL</code></td><td>Aguarda decisão da revisão vigente. EV-02 leva a <code>READY_FOR_EXECUTION</code>. EV-02B leva a <code>WAITING_REVISION</code>.</td></tr><tr><td><code>WAITING_REVISION</code></td><td>Aguarda nova revisão comercial elegível ou cancelamento conforme política. EV-01 da revisão seguinte leva a <code>WAITING_APPROVAL</code>.</td></tr><tr><td><code>READY_FOR_EXECUTION</code></td><td>Orçamento aprovado. Gravar a primeira tentativa de consumo e entrar em <code>START_PENDING</code>. Se o item não requer insumos, a OS pode iniciar localmente conforme as guardas vigentes.</td></tr><tr><td><code>START_PENDING</code></td><td>Primeiro início com resultado de consumo pendente. <code>CONSUMED</code> com guardas válidas leva a <code>IN_EXECUTION</code>. Falta confirmada de saldo devolve a Saga a <code>READY_FOR_EXECUTION</code> e o item aguarda peças. Timeout mantém a tentativa pendente.</td></tr><tr><td><code>IN_EXECUTION</code></td><td>Execução iniciada. Demais tentativas ficam registradas por item, mantendo a etapa global. Conclusão técnica válida leva a <code>WAITING_PAYMENT</code>.</td></tr><tr><td><code>WAITING_PAYMENT</code></td><td>OS <code>COMPLETED</code>, funcionário inicia cobrança no Billing. Proposta técnica: confirmação da quitação via CT-07 leva a <code>READY_FOR_DELIVERY</code>. Recusa mantém a etapa.</td></tr><tr><td><code>READY_FOR_DELIVERY</code></td><td>Última quitação consultada positiva. Revalidar CT-07 no ato da entrega e revalidar as guardas locais antes de gravar <code>DELIVERED</code> e Saga <code>COMPLETED</code>. Quitação desfeita antes da entrega retorna a <code>WAITING_PAYMENT</code>.</td></tr><tr><td><code>COMPLETED</code></td><td>Entrega registrada. Terminal no atendimento.</td></tr><tr><td><code>COMPENSATING</code></td><td>Cancelamento elegível aceito. Impede novos inícios e acompanha C1–C6. Só avança a <code>COMPENSATED</code> com os efeitos resolvidos.</td></tr><tr><td><code>COMPENSATED</code></td><td>Cancelamento local registrado após confirmação das etapas aplicáveis. Terminal no atendimento.</td></tr><tr><td><code>MANUAL_INTERVENTION</code></td><td>Tratamento humano para efeito físico, financeiro ou divergência sem resolução automática. Guardar etapa de retorno e motivo para retomar depois da decisão auditada.</td></tr></tbody></table></div>
<p>Para a prontidão de entrega, proposta de implementação: EV-03/EV-04 gravam a projeção e agendam uma atualização de quitação. A OS chama CT-07 fora da transação da inbox e aplica a resposta se a versão da solicitação ainda for a vigente. <code>settled=false</code> confirmado pode levar a <code>WAITING_PAYMENT</code>. Timeout mantém a verificação pendente. Se a mensagem de pagamento atrasar, a ação de entrega ainda pode verificar CT-07 diretamente com a OS <code>COMPLETED</code>. CT-07 positivo e guardas locais válidas permitem avançar e finalizar no mesmo commit. O HTML já determina a checagem oficial no ato da entrega. Atualização prévia de prontidão é detalhe técnico para validar.</p>
<h3 id="saga-contratos-5">5. Compensação proposta · C1–C6</h3>
<p>O cenário de referência é o cancelamento elegível antes do uso físico dos materiais. O protocolo abaixo detalha a proposta existente. A elegibilidade comercial e operacional segue pendente em D05, D10 e D11.</p>
<div class="doc-table-scroll"><table class="doc-table"><thead><tr><th scope="col">Etapa</th><th scope="col">Serviço e contrato</th><th scope="col">Resultado persistido</th></tr></thead><tbody><tr><td>C1 · Bloquear início</td><td>OS aceita o cancelamento elegível e serializa a decisão com o início do item.</td><td>Saga <code>COMPENSATING</code>, escopo, motivo e autor. Resposta tardia de consumo pode registrar o fato, porém o início fica bloqueado.</td></tr><tr><td>C2 · Reconciliar</td><td>OS consulta CT-08 <code>GET /internal/inventory/operations/{operationId}</code> para cada consumo afetado.</td><td><code>CONSUMED</code> exige resolver o efeito. <code>REVERSED</code>, <code>REJECTED</code> ou <code>CLOSED</code> comprovam que não há saldo a devolver. Com resultado desconhecido, a etapa fica pendente até confirmação do Inventory.</td></tr><tr><td>C3 · Resolver estoque</td><td>OS chama CT-08B <code>POST /internal/inventory/consumptions/{operationId}/reversal</code> com <code>compensationId</code> estável e evidência de não uso/devolução, quando aplicável.</td><td>Inventory confirma <code>REVERSED</code> após movimento inverso ou <code>CLOSED</code> após fechar a tentativa sem baixa. Uma recusa terminal consultada em C2 resolve a etapa sem reversão.</td></tr><tr><td>C4 · Solicitar cancelamento comercial</td><td>Com estoque resolvido, OS chama CT-09 <code>POST /internal/budgets/{budgetId}/cancellation</code>, vinculando a revisão.</td><td>Operação de cancelamento persistida na OS. Se nunca houve orçamento aplicável, registrar etapa dispensada com a razão verificada.</td></tr><tr><td>C5 · Confirmar cancelamento comercial</td><td>Billing valida revisão vigente, elegibilidade e efeitos financeiros.</td><td><code>CANCELLED</code> confirmado e auditado. Conflito ou efeito financeiro impede marcar a etapa como concluída.</td></tr><tr><td>C6 · Encerrar</td><td>OS valida as etapas aplicáveis e registra o encerramento local autorizado.</td><td>Item/OS <code>CANCELLED</code> conforme o escopo e as guardas acordadas. Saga <code>COMPENSATED</code> no cancelamento integral da ordem. Política de cancelamento parcial segue em D10.</td></tr></tbody></table></div>
<h4>Contratos REST e retornos</h4>
<div class="doc-table-scroll"><table class="doc-table"><thead><tr><th scope="col">Contrato</th><th scope="col">Identidade e dados</th><th scope="col">Retorno esperado e recuperação</th></tr></thead><tbody><tr><td>CT-05 · Consumo</td><td><code>operationId</code> como <code>Idempotency-Key</code>, <code>serviceOrderId</code>, <code>serviceOrderItemId</code>, <code>responsibleUserId</code>, <code>items[]</code> com <code>inventoryItemId</code> e <code>quantity</code>.</td><td><code>200 CONSUMED</code> com movimentos. <code>409 INSUFFICIENT_STOCK</code> é recusa confirmada sem baixa parcial. Durante início ativo, retry usa a mesma chave. Após falta confirmada e reposição, nova ação usa nova tentativa.</td></tr><tr><td>CT-08 · Consulta de consumo</td><td><code>operationId</code> original.</td><td>Proposta: <code>200</code> com resultado durável <code>CONSUMED</code>, <code>REJECTED</code>, <code>REVERSED</code> ou <code>CLOSED</code>. Operação ausente/andamento ou falha de consulta é tratada na OS como resultado desconhecido até confirmação. Alinhar o HTTP correspondente com Anderson.</td></tr><tr><td>CT-08B · Reversão ou fechamento</td><td><code>operationId</code> original na URL, <code>compensationId</code> como <code>Idempotency-Key</code>, <code>reason</code> e <code>unusedConfirmed</code> como no HTML. OS retém autor, momento e evidência da conferência.</td><td><code>200 REVERSED</code> após movimento inverso ou <code>200 CLOSED</code> após fechamento atômico de tentativa sem baixa. Ambos retornam <code>operationId</code> e <code>compensationId</code>. Retry usa a mesma chave. Se houver devolução física, acordar como o pedido referencia a evidência.</td></tr><tr><td>CT-09 · Cancelamento comercial</td><td><code>budgetId</code> na URL, <code>operationId</code> como <code>Idempotency-Key</code>, <code>budgetVersion</code> e <code>reason</code>.</td><td><code>200 CANCELLED</code> com <code>budgetId</code> e <code>operationId</code>. Proposta: <code>409</code> com código estável para revisão divergente, inelegibilidade ou efeito financeiro. Após timeout, repetir o mesmo POST para recuperar o resultado.</td></tr></tbody></table></div>
<p><strong>Fechamento `CLOSED`.</strong> Inventory grava o fechamento mesmo quando o consumo ainda não chegou. Durante o cancelamento, a OS bloqueia novos inícios e retentativas de CT-05. Uma consulta ausente pode indicar requisição em trânsito, então a OS envia CT-08B para resolver a tentativa e espera a confirmação do Inventory. CT-05 e CT-08B serializam pela mesma identidade de operação no PostgreSQL, inclusive quando a linha ainda não existe. Se CT-08B chegar primeiro, grava <code>CLOSED</code> e um CT-05 atrasado recebe a recusa proposta <code>409 ATTEMPT_CLOSED</code>. Se CT-05 confirmar a baixa primeiro, CT-08B encontra <code>CONSUMED</code> e só devolve saldo com a validação de não uso ou devolução. Se a resposta de CT-08B se perder, a OS repete o pedido com o mesmo <code>compensationId</code> ou consulta CT-08 para reconciliar o efeito. Sem confirmação durável, a Saga mantém a compensação pendente.</p>
<p><strong>Recusa, falha técnica e efeito físico.</strong> Falta de saldo confirmada espera nova ação após reposição. Timeout mantém a operação para recuperação. Peça efetivamente utilizada exige tratamento explícito, e qualquer restituição de saldo depende da devolução válida. Pagamento recusado após reparo preserva OS <code>COMPLETED</code> e mantém entrega bloqueada. Em duplicidade confirmada, Billing identifica a cobrança excedente, persiste a operação de estorno, reconcilia o provedor e registra <code>REFUNDED</code> quando confirmado. EV-04 pode informar esse fato à OS. A quitação da cobrança válida é reavaliada pelo CT-07.</p>
<h3 id="saga-contratos-6">6. Persistência por microsserviço</h3>
<p>Usar a topologia do HTML: uma instância RDS PostgreSQL com três databases lógicos isolados e migrations Flyway no repositório de cada serviço. Os nomes e tabelas abaixo são referências de implementação.</p>
<div class="doc-table-scroll"><table class="doc-table"><thead><tr><th scope="col">Dono e database</th><th scope="col">Registro</th><th scope="col">Campos, estados e restrições essenciais</th></tr></thead><tbody><tr><td>OS · <code>numberone_os</code></td><td>Ordem</td><td>Catálogo comercial do HTML: <code>RECEIVED</code>, <code>IN_DIAGNOSIS</code>, <code>WAITING_APPROVAL</code>, <code>APPROVED</code>, <code>REJECTED</code>, <code>IN_PROGRESS</code>, <code>COMPLETED</code>, <code>CANCELLED</code>, <code>DELIVERED</code>. As guardas de cancelamento seguem em revisão.</td></tr><tr><td>OS · <code>numberone_os</code></td><td>Itens e projeções</td><td>Item: <code>PENDING</code>, <code>WAITING_FOR_PARTS_AND_SUPPLIES</code>, <code>IN_PROGRESS</code>, <code>COMPLETED</code>, <code>CANCELLED</code> no catálogo do HTML. Persistir composição técnica, quantidades previstas, referência/revisão e valor aprovado/moeda, pagamento projetado por <code>paymentId</code> e versão e informação da última consulta CT-07.</td></tr><tr><td>OS · <code>numberone_os</code></td><td><code>service_order_saga</code></td><td><code>saga_id</code>, <code>service_order_id</code> único, <code>state</code>, versão de concorrência, referências vigentes, etapa de retorno, motivo/autor de cancelamento ou intervenção, datas. Atualizar com a transição local da ordem quando ambas mudam.</td></tr><tr><td>OS · <code>numberone_os</code></td><td><code>saga_operation</code></td><td><code>operation_id</code> único, Saga, item e tentativa quando aplicável, tipo de operação, ID original ao compensar, request imutável, resultado remoto, motivos, tentativas, próxima execução, posse e datas. Estados: <code>PENDING</code>, <code>AWAITING_RESULT</code>, <code>SUCCEEDED</code>, <code>REJECTED</code>, <code>SKIPPED</code>, <code>NEEDS_REVIEW</code>. Proteger contra duas tentativas ativas de início do mesmo item.</td></tr><tr><td>OS · <code>numberone_os</code></td><td><code>inbox_event</code></td><td><code>event_id</code> único <h4>Histórico de revisões veiculares no DynamoDB</h4>
<p>O uso de NoSQL para a entrega será o histórico das revisões registradas pela OS, consultável por veículo. A Saga e as operações de integração permanecem no PostgreSQL. Na conclusão de uma manutenção executada, a OS grava o snapshot e a pendência de projeção na mesma transação que registra <code>COMPLETED</code>. Um worker da própria OS lê a outbox local e grava no DynamoDB com chave estável e escrita condicional. O retry usa a mesma chave e confirma a projeção já existente quando o conteúdo coincide.</p>
<p>Para a tabela <code>vehicle_maintenance_history</code>, a proposta anterior usa <code>vehicleId</code> como chave de partição e <code>completedAt#serviceOrderId#historyVersion</code> como chave de ordenação. A versão inicial é fixa no snapshot. A projeção pode ser retomada após indisponibilidade do DynamoDB, sem bloquear a conclusão, o pagamento ou a entrega. A OS consulta o histórico por sua API autorizada. <a href="implementacao-os/fase-6-historico-nosql.md">Especificação do histórico veicular</a></p>
<h3 id="saga-contratos-7">7. Alinhamentos com a equipe</h3>
<h4>Com Julio · Orçamento e eventos financeiros</h4>
<ul><li><strong>O que significa `OrcamentoEnviado`?</strong> A proposta é que o Billing registre <code>SENT</code> quando a revisão estiver disponível para o cliente decidir, e grave o evento no mesmo commit. A OS entra em <code>WAITING_APPROVAL</code>. O resultado da notificação por e-mail fica registrado separadamente no Billing, que pode reenviar a notificação da mesma revisão. Julio precisa confirmar se disponibilizar para aprovação é suficiente ou se o processo também exige aceite do provedor de e-mail para marcar <code>SENT</code>.</li><li><strong>Como identificar o orçamento vigente?</strong> Billing gera uma revisão crescente por OS e mantém o número estável no envio e na decisão. Exemplo: o orçamento da revisão 1 é rejeitado e o da revisão 2 é aprovado. Se chegar um <code>OrcamentoEnviado</code> atrasado da revisão 1, a OS mantém a revisão 2. Julio e Matheus precisam combinar como Billing garante a identidade única da revisão e como OS recupera o vínculo caso a decisão chegue antes do envio.</li><li><strong>Para que serve `PagamentoAtualizado`?</strong> Se Billing confirmou pagamento e depois confirmou um estorno integral, EV-04 atualiza a projeção que antes mostrava <code>PAID</code>. Sugestão: incluir EV-04 na v1 se o estorno integral entrar nessa versão. Se só uma cobrança excedente for estornada, a cobrança válida ainda pode quitar a ordem. CT-07 continua sendo a confirmação de quitação, considerando o conjunto de pagamentos.</li></ul>
<h4>Com o grupo · Política de referência para cancelamento e entrega</h4>
<ul><li><strong>C1–C6 automático antes da execução confirmada.</strong> Para a primeira versão, limitar a compensação automática ao cancelamento integral antes da confirmação do primeiro início e com ausência de uso físico confirmada. Um funcionário autorizado registra quem conferiu, quando e quais materiais estão envolvidos. Estoque resolve todas as tentativas afetadas antes de solicitar o cancelamento do orçamento vigente ao Billing, desde que elegível e sem efeito financeiro.</li><li><strong>Execução já iniciada, uso físico ou cancelamento parcial.</strong> Encaminhar para revisão operacional. A movimentação de retorno exige devolução física conferida. Se todos os itens acabarem cancelados, tratar o encerramento e a retirada pela política a validar com a equipe, sem gerar cobrança automática.</li><li><strong>Estorno e entrega.</strong> Manter CT-07 imediatamente antes de registrar a entrega. Automatizar, se fizer parte do escopo, o estorno da cobrança excedente que o Billing identificou com segurança. Para estornar a cobrança que quita a OS, orientar autorização manual e coordenação com quem entrega o veículo. Uma consulta CT-07 seguida de commit local ainda permite uma corrida com o estorno. Se o grupo exigir bloquear a concorrência por sistema, será necessário alinhar um protocolo adicional entre OS e Billing. Após entrega, tratar eventual estorno como ocorrência financeira auditada.</li></ul>

<h4>Cenários de aceite dos contratos</h4>
<ul><li>Caminho normal: orçamento aprovado, consumo confirmado, reparo concluído, cobrança manual, EV-03 e entrega após CT-07 positivo.</li><li>Repetir um EV-02 e reenviar EV-01 depois da aprovação. Confirmar uma única decisão aplicada e nenhuma regressão.</li><li>Interromper Billing após envio ao SQS e OS após commit da inbox. Retomar ambos e verificar efeito único.</li><li>Simular timeout após baixa em CT-05. Recuperar pelo CT-08 e verificar que há um único movimento por material.</li><li>Cancelar antes de uso, repetir CT-08B e CT-09 e retomar a Saga após reinício entre C3 e C4. Confirmar saldo reposto uma vez e Saga compensada somente no fim.</li><li>Encerrar a tentativa com <code>CLOSED</code> antes da chegada do consumo e provar que CT-05 atrasado recebe recusa e preserva o saldo.</li><li>Receber EV-04 antes de EV-03 do mesmo pagamento. Verificar que a projeção usa a versão mais nova e que entrega depende da quitação oficial.</li><li>Concluir uma manutenção com DynamoDB indisponível e retomar a projeção. Consultar o histórico do veículo e verificar uma única entrada para a OS após repetir a tarefa.</li></ul></div></template>

function packageZip(files){const enc=new TextEncoder(),pieces=[],central=[];let offset=0;const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];for(let [fn,content] of Object.entries(files)){let f=enc.encode(fn),v=enc.encode(content),crc=crc32(v);let loc=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(v.length),...u32(v.length),...u16(f.length),...u16(0),...f]);pieces.push(loc,v);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(v.length),...u32(v.length),...u16(f.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...f]));offset+=loc.length+v.length}const csize=central.reduce((a,x)=>a+x.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(central.length),...u16(central.length),...u32(csize),...u32(offset),...u16(0)]);return new Blob([...pieces,...central,end],{type:'application/zip'})}

function mdSafe(v){return String(v??'').replace(/\r\n/g,'\n')}
function mdFence(v){let t=mdSafe(v).trim();if(!t)return '_Não definido._';let fence='```';while(t.includes(fence))fence+='`';return fence+'\n'+t+'\n'+fence}
function mdContract(c){let linked=(c.ucs||[]).join(', ')||'Não associado';return `### ${c.id} — ${c.title}\n\n- **Status:** ${c.status||'Não definido'}\n- **Classificação:** ${c.changeKind==='new'?'Novo / Fase 4':c.changeKind==='changed'?'Contrato alterado':'Referência existente'}\n- **Motivo da classificação:** ${c.changeDescription||'Não informado'}\n- **Evidência:** ${c.sourceReference||'A definir'}\n- **Origem:** ${c.origin||'A definir'}\n- **Proprietário:** ${c.owner||names[c.to]||c.to}\n- **Tipo:** ${c.kind==='event'?'Evento SQS':c.kind==='external'?'Integração externa':'REST'}\n- **Origem → destino:** ${names[c.from]||c.from} → ${names[c.to]||c.to}\n- **Método/operação:** ${c.method||'A definir'}\n- **Rota/evento:** \`${c.path||'A definir'}\`\n- **Casos de uso:** ${linked}\n\n**Request / payload**\n\n${mdFence(c.request)}\n\n**Response / processamento**\n\n${mdFence(c.response)}\n\n**Erros e exceções**\n\n${mdSafe(c.errors)||'_Não definidos._'}\n\n**Observações**\n\n${mdSafe(c.notes)||'_Sem observações._'}\n\n`}
function buildContractsMarkdown(){let groups=[['OS Service',c=>c.kind!=='event'&&(c.to==='os'||c.owner==='OS Service')],['Billing Service',c=>c.kind!=='event'&&(c.to==='billing'||c.owner==='Billing Service')],['Inventory Service',c=>c.kind!=='event'&&(c.to==='inventory'||c.owner==='Inventory Service')],['Eventos SQS',c=>c.kind==='event'],['Integrações externas',c=>c.kind==='external']];let added=new Set(),lines=['# NumberOne — Contratos de integração','',`Exportado em: ${new Date().toLocaleString('pt-BR')}`,'','**Documento de trabalho:** inclui contratos existentes, propostos e pendentes; status indica o nível de validação. Não equivale a OpenAPI/AsyncAPI aprovado.',''];for(let [name,filter] of groups){lines.push('## '+name,'');let items=state.contracts.filter(c=>filter(c)&&!added.has(c.id));for(let c of items){lines.push(mdContract(c));added.add(c.id)}if(!items.length)lines.push('_Sem contratos nesta categoria._','')}let rest=state.contracts.filter(c=>!added.has(c.id));if(rest.length){lines.push('## Outros contratos','');for(let c of rest)lines.push(mdContract(c))}return lines.join('\n')}

function buildChangesMarkdown(){let out=['# NumberOne — Alterações em relação à versão-base','',`Comparação realizada em: ${new Date().toLocaleString('pt-BR')}`,'','A versão-base é o conteúdo original incorporado ao HTML. Ajustes feitos apenas no navegador aparecem abaixo.',''];let n=0;function change(where,before,after){if(JSON.stringify(before)===JSON.stringify(after))return;n++;out.push(`## ${n}. ${where}`,'','**Antes:**',mdFence(JSON.stringify(before,null,2)),'','**Depois:**',mdFence(JSON.stringify(after,null,2)),'')}

function svgSequence(u){const participants=u.participants,steps=u.steps;const gap= participants.length>=6?180:participants.length>=4?205:255;const width=Math.max(850,160+(participants.length-1)*gap);const left=(width-(participants.length-1)*gap)/2;const coords={};participants.forEach((p,i)=>coords[p]=left+i*gap);const top=75,stepHeight=56,height=top+steps.length*stepHeight+30;let parts=[];parts.push(`<svg class="sequence" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de sequência ${htmlEscape(u.id)}" width="${width}" viewBox="0 0 ${width} ${height}">`);parts.push(`<defs><marker id="arr-rest" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#458bf2"/></marker><marker id="arr-event" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#ed8a21"/></marker><marker id="arr-response" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#91a1b8"/></marker></defs>`);for(let p of participants){let x=coords[p],fill=color[p]||'#64748b';parts.push(`<rect x="${x-69}" y="7" width="138" height="39" rx="9" fill="${fill}"/><text x="${x}" y="31" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">${htmlEscape(names[p]||p)}</text><path d="M${x} 46 V${height-17}" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="5 6" />`)}
steps.forEach((s,i)=>{let a=coords[s.from],b=coords[s.to],y=top+i*stepHeight,kind=s.kind,clr=kind==='event'?'#ed8a21':kind==='response'?'#91a1b8':kind==='external'?'#0d9ea8':kind==='internal'?'#7184a2':'#458bf2';let m=kind==='event'?'arr-event':kind==='response'?'arr-response':'arr-rest';if(a===undefined||b===undefined)return;if(a===b){parts.push(`<path d="M${a} ${y} h48 v22 h-48" fill="none" stroke="${clr}" stroke-width="1.65" marker-end="url(#${m})"/>`);parts.push(`<rect x="${a+9}" y="${y-20}" width="${Math.max(70,Math.min(255,(s.label.length+4)*6.1))}" height="17" rx="3" fill="var(--panel)"/><text x="${a+13}" y="${y-8}" font-size="11" fill="var(--txt)">${htmlEscape((i+1)+". "+s.label)}</text>`)}else{let leftX=Math.min(a,b)+11,rightX=Math.max(a,b)-11,mid=(a+b)/2;parts.push(`<line x1="${a+(a<b?10:-10)}" y1="${y}" x2="${b+(a<b?-10:10)}" y2="${y}" stroke="${clr}" stroke-width="1.8" ${kind==='event'?'stroke-dasharray="6 4"':kind==='response'?'stroke-dasharray="3 4"':''} marker-end="url(#${m})"/>`);let label=(i+1)+". "+s.label,maxPx=Math.abs(a-b)-16,maxChars=Math.max(10,Math.floor(maxPx/6.4));if(label.length>maxChars)label=label.slice(0,maxChars-1)+'…';parts.push(`<text x="${mid}" y="${y-9}" text-anchor="middle" font-size="11" fill="var(--txt)">${htmlEscape(label)}</text>`)}if(s.contract){parts.push(`<rect x="${Math.max(0,Math.min(width-67,(a+b)/2-33))}" y="${y+5}" width="66" height="17" rx="8" fill="var(--panel-alt)" stroke="var(--line)"/><text x="${(a+b)/2}" y="${y+17}" font-size="9" fill="var(--muted)" text-anchor="middle">${htmlEscape(s.contract)}</text>`)}});parts.push('</svg>');return `<div class="diagram-scroll">${parts.join('')}</div><div class="legend"><span><i style="background:#458bf2"></i>REST</span><span><i style="background:#91a1b8"></i>Resposta</span><span><i style="background:#ed8a21"></i>SQS / evento</span><span><i style="background:#0d9ea8"></i>Integração externa</span><span><i style="background:#7184a2"></i>Processamento interno</span></div>`}

function contractHTML(c){let kind=c.kind==='event'?'SQS':c.kind==='external'?'EXTERNO':'REST',cls=c.kind==='event'?'orange':c.kind==='external'?'green':'blue';let change=contractChangeType(c),t=c.changeKind==='new'?'new':c.changeKind==='changed'?'changed':'';return `<details class="contract ${t?'contract-'+t:''}" data-contract="${htmlEscape(c.id)}" ${openContracts[c.id]?'open':''}><summary><div style="min-width:0"><div class="row" style="flex-wrap:wrap"><span class="tag ${cls}">${kind}</span><span class="contractname">${htmlEscape(c.id)} · ${htmlEscape(c.title)}</span>${change?`<span class="tag change-${t}">● ${htmlEscape(change)}</span>`:''}</div><div class="contractpath">${htmlEscape(c.method)} ${htmlEscape(c.path)}</div></div><span class="muted">▾</span></summary><div class="contractdetail"><div class="row space" style="flex-wrap:wrap"><div class="mini muted">${htmlEscape(names[c.from]||c.from)} → ${htmlEscape(names[c.to]||c.to)} · ${htmlEscape(c.status||'Em definição')}</div><button class="small" data-contract-edit="${htmlEscape(c.id)}">✎ Editar contrato</button></div>${t?`<div class="change-explanation ${t==='new'?'new':''}"><strong>${t==='changed'?'O que será alterado':'Por que é novo'}:</strong> ${htmlEscape(c.changeDescription||'Descrição a completar')}</div>`:''}<div class="contractgrid"><div><span class="fieldlabel">Request / Payload</span><pre class="codeblock">${htmlEscape(c.request)}</pre></div><div><span class="fieldlabel">Response / Processamento</span><pre class="codeblock">${htmlEscape(c.response)}</pre></div></div><div><span class="fieldlabel">Erros, situações excepcionais</span><div class="banner">${htmlEscape(c.errors||'Não detalhado')}</div></div>${c.notes?`<div><span class="fieldlabel">Notas da especificação</span><div class="mini muted">${htmlEscape(c.notes)}</div></div>`:''}${c.sourceReference?`<div class="mini muted">Fonte: ${htmlEscape(c.sourceReference)}</div>`:''}</div></details>`}
function overview(){return head('Arquitetura · NumberOne','Visão geral','Decomposição do monólito em três microserviços. Esta página apresenta apenas o essencial para orientar a reunião.')+section('Componentes e responsabilidades','Identidade visual consistente em todos os diagramas',`<div class="sectionbody"><div class="servicegrid">${[['os','OS Service','Matheus · Clientes, veículos, diagnóstico, execução e Saga'],['billing','Billing Service','Julio · Orçamento, aprovação, pagamento e notificações'],['inventory','Inventory Service','Anderson · Peças, preços, estoque e movimentações']].map(([id,n,d])=>`<div class="service"><div class="bar" style="background:${color[id]}"></div><h3>${n}</h3><p>${d}</p></div>`).join('')}</div><div style="height:16px"></div><div class="note">Plataforma (Marcelo): API Gateway, autenticação, EKS, filas, observabilidade e deploy. Cada serviço possui banco sob sua responsabilidade.</div></div>`)+section('Jornada de atendimento','Da abertura à entrega, sem criação automática de pagamento',`<div class="sectionbody">${timeline(state.saga.main)}<div style="height:20px"></div><div class="banner"><strong>Regra vigente:</strong> pagamento só pode ser criado após OS COMPLETED. Entrega exige quitação consultada em Billing por REST.</div></div>`)+section('Como conduzir a reunião','Uma navegação simples por UC',`<div class="sectionbody"><p class="muted" style="margin-top:0">Abra um caso de uso no menu lateral, apresente o diagrama, ajuste as regras/decisões, anote pontos e expanda os contratos apenas quando necessário. No fim, exporte os contratos e o pacote de anotações/alterações para revisão no ChatGPT.</p><button class="primary" data-goto="UC-01">Começar pelo UC-01 →</button></div>`)}
function timeline(items){return `<ol class="timeline">${items.map((x,i)=>`<li><span class="count" style="background:${color[x.owner]||'#65738b'}">${i+1}</span><div><strong>${htmlEscape(x.name)}</strong><p>${htmlEscape(x.description)}</p></div></li>`).join('')}</ol>`}

const repoTypeColors={'Novo':'#3b82f6','Modificado':'#d6a12d','Transferido':'#a78bfa','Existente':'#94a3b8'};
function repoBadge(type){return `<span class="repo-impact" style="--impact:${repoTypeColors[type]||'#94a3b8'}">${htmlEscape(type)}</span>`}
function repoView(){
 const all=state.repositoryCatalog,repos=all.repos;
 const body=repos.map(repo=>{
  let items=all.items.filter(x=>x.repo===repo.id);
  // Transferências aparecem apenas no repositório de destino, nunca como recurso de ownership no Auth.
  if(repo.id==='auth')items=items.filter(x=>!(/API Gateway|VPC Link/i.test(x.name)));
  const url=repo.url&&repo.availability==='Existente'?`<a href="${htmlEscape(repo.url)}" target="_blank" rel="noopener noreferrer">Abrir no GitHub ↗</a>`:`<span class="muted">${htmlEscape(repo.name)} · ${repo.availability==='A criar'?'nome sugerido, repositório ainda a criar':'link não confirmado'}</span>`;
  const lines=items.map(item=>`<tr><td>${htmlEscape(item.name)}</td><td>${htmlEscape(item.detail||'')}</td><td>${repoBadge(item.status)}</td></tr>`).join('');
  return section(repo.short,repo.description,`<div class="sectionbody"><div class="doc-repo-header"><strong>${htmlEscape(repo.name)}</strong> <span>${url}</span></div><div class="doc-table-scroll"><table class="doc-table"><thead><tr><th>Recurso / entregável</th><th>O que fica neste repositório</th><th>Classificação</th></tr></thead><tbody>${lines}</tbody></table></div></div>`);
 }).join('');
 return head('Organização · Fase 4','Repositórios e responsabilidades','Documentação de ownership: cada recurso aparece somente no repositório que será responsável por ele.')+
 `<div class="note doc-warning">${repoBadge('Novo')} a criar · ${repoBadge('Modificado')} adaptar · ${repoBadge('Transferido')} mudança de ownership · ${repoBadge('Existente')} referência existente. A transferência do API Gateway e do VPC Link para o Cloud exige migração planejada do Terraform state, sem duplicar recursos.</div>`+body;
}
function repoAudit(action,item,before,after){state.repositoryChanges.push({timestamp:new Date().toISOString(),action,resourceId:item?.id||null,name:item?.name||null,before,after});}
function repoTouch(ids){for(let rid of ids){let r=state.repositoryCatalog.repos.find(x=>x.id===rid);if(r)r.confirmed=false;}}
function repoEditor(item=null,mode='edit'){
const target=item?document.querySelector(`[data-repo-item="${item.id}"] .repo-item-editor`):document.querySelector('#repoEditor');if(!target)return;
const repo=state.repositoryCatalog.repos.find(x=>x.id===activeRepo);
if(mode==='transfer'){target.innerHTML=`<div class="repo-inline-editor"><label class="mini">Transferir para outro repositório</label><select class="fieldinput" data-repo-target>${state.repositoryCatalog.repos.filter(x=>x.id!==item.repo).map(r=>`<option value="${r.id}">${htmlEscape(r.short)} · ${htmlEscape(r.name)}</option>`).join('')}</select><div class="repo-editor-buttons"><button class="small" data-repo-cancel>Cancelar</button><button class="small primary" data-repo-save>Transferir</button></div></div>`;target.querySelector('[data-repo-save]').onclick=()=>{let from=item.repo,to=target.querySelector('[data-repo-target]').value;if(from===to)return;const before=deepcopy(item);item.repo=to;item.status='Transferido';item.source='Transferência aprovada na reunião; origem: '+state.repositoryCatalog.repos.find(r=>r.id===from)?.name;repoAudit('transferido',item,before,deepcopy(item));repoTouch([from,to]);save();render();notify('Transferido para '+to)};}
else{target.innerHTML=`<div class="repo-inline-editor"><label class="mini">Recurso / responsabilidade</label><input class="fieldinput" data-repo-title value="${htmlEscape(item?.name||'')}" placeholder="Nome do recurso"><label class="mini">Tipo de mudança</label><select class="fieldinput" data-repo-status>${Object.keys(repoTypeColors).map(t=>`<option value="${t}" ${item?.status===t?'selected':''}>${t}</option>`).join('')}</select><label class="mini">O que deve existir / justificativa</label><textarea class="fieldinput" data-repo-detail rows="3">${htmlEscape(item?.detail||'')}</textarea><label class="mini">Base da informação / condição</label><input class="fieldinput" data-repo-source value="${htmlEscape(item?.source||'Decidido na reunião')}"/><label class="mini">Grupo</label><input class="fieldinput" data-repo-category value="${htmlEscape(item?.category||'Configuração')}"/><div class="repo-editor-buttons"><button class="small" data-repo-cancel>Cancelar</button><button class="small primary" data-repo-save>${item?'Salvar mudanças':'Adicionar recurso'}</button></div></div>`;
target.querySelector('[data-repo-save]').onclick=()=>{let title=target.querySelector('[data-repo-title]').value.trim(),detail=target.querySelector('[data-repo-detail]').value.trim(),cat=target.querySelector('[data-repo-category]').value.trim();if(!title||!detail||!cat){notify('Preencha nome, grupo e descrição');return;}const before=item?deepcopy(item):null;const value={id:item?.id||'RR-'+Date.now()+'-'+Math.floor(Math.random()*10000),repo:item?.repo||repo.id,category:cat,name:title,status:target.querySelector('[data-repo-status]').value,detail,source:target.querySelector('[data-repo-source]').value.trim()||'Decisão da reunião',confirmed:false};if(item)Object.assign(item,value);else state.repositoryCatalog.items.push(value);repoAudit(item?'editado':'adicionado',value,before,deepcopy(value));repoTouch([value.repo]);save();render();notify(item?'Recurso atualizado':'Recurso adicionado')};}
target.querySelector('[data-repo-cancel]').onclick=()=>{target.innerHTML=''};
}
function bindRepository(){document.querySelectorAll('[data-repo-tab]').forEach(b=>b.onclick=()=>{activeRepo=b.dataset.repoTab;render()});document.querySelectorAll('[data-repo-add]').forEach(b=>b.onclick=()=>repoEditor(null));document.querySelectorAll('[data-repo-confirm]').forEach(b=>b.onclick=()=>{let r=state.repositoryCatalog.repos.find(x=>x.id===b.dataset.repoConfirm);if(!r)return;r.confirmed=!r.confirmed;repoAudit(r.confirmed?'confirmado':'reaberto',null,{repo:r.id,confirmed:!r.confirmed},{repo:r.id,confirmed:r.confirmed});save();render();notify(r.confirmed?'Responsabilidades confirmadas':'Confirmação removida')});document.querySelectorAll('[data-repo-edit]').forEach(b=>b.onclick=()=>repoEditor(state.repositoryCatalog.items.find(x=>x.id===b.dataset.repoEdit)));document.querySelectorAll('[data-repo-transfer]').forEach(b=>b.onclick=()=>repoEditor(state.repositoryCatalog.items.find(x=>x.id===b.dataset.repoTransfer),'transfer'));document.querySelectorAll('[data-repo-remove]').forEach(b=>b.onclick=()=>{let i=state.repositoryCatalog.items.find(x=>x.id===b.dataset.repoRemove);if(!i||!confirm('Excluir "'+i.name+'" desta proposta? A exclusão ficará registrada no export.'))return;repoAudit('excluído',i,deepcopy(i),null);state.repositoryCatalog.items=state.repositoryCatalog.items.filter(x=>x.id!==i.id);repoTouch([i.repo]);save();render();notify('Exclusão registrada')});}
function buildRepositoriesMarkdown(){let out=['# NumberOne — Repositórios e responsabilidades','','**Fase 4 · proposta para revisão em equipe**','','Legenda: Novo / Modificado / Transferido / Existente. Uma etiqueta não comprova implantação.',''];for(const repo of state.repositoryCatalog.repos){out.push('## '+repo.name,'','- **Status de confirmação:** '+(repo.confirmed?'Confirmado':'Pendente'),'- **Situação do repositório:** '+repo.availability,'- **URL:** '+(repo.url||'Não criado; nome sugerido'),'- **Responsabilidade:** '+repo.description,'');for(const item of state.repositoryCatalog.items.filter(x=>x.repo===repo.id))out.push('- **['+item.status+'] '+item.category+' · '+item.name+'** — '+item.detail+' (Base: '+item.source+')');out.push('')}out.push('## Histórico de ações','','Ações de edição, transferência e exclusão registradas durante a reunião.','');for(const c of state.repositoryChanges||[])out.push('- '+c.timestamp+' · '+c.action+' · '+(c.name||c.resourceId||'repositório'));return out.join('\n')}

function contextTable(headers,rows){return `<div class="doc-table-scroll"><table class="doc-table"><thead><tr>${headers.map(h=>`<th>${htmlEscape(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function contextUcLinks(ids){return ids.length?ids.map(id=>`<button class="small doc-uc-link" data-goto="${htmlEscape(id)}">${htmlEscape(id)}</button>`).join(' '):'<span class="muted">Transversal</span>'}
function contextContractRows(key){

 let ids=state.contracts.filter(c=>c.owner===owner && c.kind==='rest');

 `<div class="note doc-warning"><strong>Repositório:</strong> ${repoLink}. Referência de implementação; JSONs, erros e payloads permanecem nos contratos dos respectivos UCs.</div>`+
 section('01 · Casos de uso','Responsabilidade principal e participação',`<div class="sectionbody"><div class="doc-scope-ucs"><b>Principais:</b> ${contextUcLinks(g.main)} <span class="muted">&nbsp; Participa:</span> ${contextUcLinks(g.part)}</div></div>`)+

 section('03 · Contratos REST','Referências aos contratos originais, sem duplicar JSON',`<div class="sectionbody">${contextTable(['Contrato','Método / endpoint','Finalidade','UC'],contextContractRows(key))}<p class="mini muted">Contratos internos e legados estão discriminados pela referência CT/LEG; a situação de aprovação deve ser conferida no UC.</p></div>`)+
 section('04 · Eventos e integrações','Dependências de outros serviços e sistemas',`<div class="sectionbody">${contextTable(['Origem / destino','Protocolo','Responsabilidade'],g.integrations.map(a=>a.map(x=>htmlEscape(x))))}${key==='inventory'?'':`<h3 class="doc-subhead">Eventos SQS relacionados</h3>${contextTable(['ID','Evento','Papel','UC'],events)}`}</div>`)+

 const migration=[['API Gateway HTTP API','numberone-app-auth','postech15soat-infra-cloud','Transferir ownership Terraform e adaptar rotas.'],['VPC Link','numberone-app-auth','postech15soat-infra-cloud','Transferir ownership sem recriação.'],['Rotas e integrações','numberone-app-auth','postech15soat-infra-cloud','Apontar para os três serviços.'],['Autorização das rotas','Integração Gateway + Auth','Cloud configura / Auth publica Lambda','Cloud referencia ARN do Authorizer mantido no Auth.']];
 const depends=[['Infra Cloud ↔ Auth','ARN do Lambda Authorizer, permissões de invocação e rotas.'],['Infra Cloud ↔ Serviços','Endereços internos do EKS e integrações HTTP por serviço.'],['Infra Cloud ↔ OS/Billing','ARN/URL da fila SQS e permissões de consumo/publicação.'],['Infra Database ↔ Serviços','Endpoint RDS, nome dos databases e credenciais com acesso restrito.'],['Governança ↔ Repositórios','Rulesets e checks necessários para liberar merges/deploys.']];
 function badge(t){const cls={Novo:'info',Modificado:'warning',Transferido:'discovery',Existente:'secondary',Definido:'secondary'}[t]||'secondary';return `<span class="status-chip platform-tag platform-${t.toLowerCase()}">${htmlEscape(t)}</span>`}

function sagaView(){let failures=state.saga.failure.map(([s,t,k])=>`<tr><td>${htmlEscape(s)}</td><td>${htmlEscape(t)}</td><td>${htmlEscape(k)}</td></tr>`).join('');return head('Orquestração · proposta do Matheus','Saga do atendimento','Estados, recuperação e compensações discutidos na proposta da equipe. O fluxo apresentado é uma referência de negócio, não uma transação única.')+section('01 · Fluxo principal','Orquestrador: OS Service',`<div class="sectionbody">${timeline(state.saga.main)}</div>`)+section('02 · Compensação antes do início efetivo','Cenário C1–C6 · cancelar antes do uso das peças',`<div class="sectionbody">${timeline(state.saga.comp)}<div class="note">A reversão automática exige comprovação de que o material não foi utilizado ou de que houve devolução física. Resultados UNKNOWN permanecem pendentes.</div></div>`)+section('03 · Falhas, recuperação e compensação','Retry não é compensação',`<div class="sectionbody"><table class="tbl"><thead><tr><th>Situação</th><th>Tratamento</th><th>Natureza</th></tr></thead><tbody>${failures}</tbody></table></div>`)+section('04 · Notas e decisões sobre a Saga','Registre mudanças na proposta do Matheus',`<div class="sectionbody"><textarea class="editor longeditor" id="sagaNotes" placeholder="Registre alterações propostas na reunião...">${htmlEscape(state.notes.saga||'')}</textarea></div>`)+section('05 · Contratos da Saga','Complemento técnico do Matheus · proposta para revisão',el('#saga-contract-supplement').innerHTML)}

function bindPage(u){if(route==='context-os' && el('#sagaScopeNotes'))el('#sagaScopeNotes').oninput=e=>{state.notes=state.notes||{};state.notes.sagaScope=e.target.value;save()};if(route==='repositories')bindRepository();document.querySelectorAll('[data-naming-category]').forEach(b=>b.onclick=()=>{activeNamingCategory=b.dataset.namingCategory;render()});document.querySelectorAll('[data-naming-edit]').forEach(b=>b.onclick=()=>editNaming(b.dataset.namingEdit));document.querySelectorAll('[data-naming-confirm]').forEach(b=>b.onclick=()=>{let r=state.naming.find(x=>x.id===b.dataset.namingConfirm);if(r){r.confirmed=!r.confirmed;save();render();notify(r.confirmed?'Nome confirmado':'Confirmação reaberta')}});document.querySelectorAll('[data-state-domain]').forEach(b=>b.onclick=()=>{activeStateCatalog=b.dataset.stateDomain;render()});document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>navigate(b.dataset.goto));document.querySelectorAll('details.contract').forEach(det=>{det.addEventListener('toggle',()=>openContracts[det.dataset.contract]=det.open)});document.querySelectorAll('[data-contract-edit]').forEach(b=>b.onclick=()=>openContractEditor(b.dataset.contractEdit));if(u){document.querySelectorAll('[data-rule]').forEach(x=>x.oninput=()=>{u.rules[+x.dataset.rule].text=x.value;save()});document.querySelectorAll('[data-remove-rule]').forEach(x=>x.onclick=()=>{if(confirm('Remover esta regra?')){u.rules.splice(+x.dataset.removeRule,1);save();render()}});el('#addRule').onclick=()=>{u.rules.push({id:u.id+'-RN-'+String(u.rules.length+1).padStart(2,'0'),text:'Nova regra de negócio'});save();render()};document.querySelectorAll('[data-decision-text]').forEach(x=>x.oninput=()=>{u.decisions[+x.dataset.decisionText].text=x.value;save()});document.querySelectorAll('[data-decision-status]').forEach(x=>x.onchange=()=>{u.decisions[+x.dataset.decisionStatus].status=x.value;save()});document.querySelectorAll('[data-remove-decision]').forEach(x=>x.onclick=()=>{if(confirm('Remover esta decisão?')){u.decisions.splice(+x.dataset.removeDecision,1);save();render()}});el('#addDecision').onclick=()=>{u.decisions.push({text:'Nova decisão / validação',status:'A validar'});save();render()};el('#ucNotes').oninput=e=>{u.meetingNotes=e.target.value;save()}}else if(route==='saga'){el('#sagaNotes').oninput=e=>{state.notes.saga=e.target.value;save()}}else if(route==='decisions'){document.querySelectorAll('[data-general-status]').forEach(x=>x.onchange=()=>{state.decisions[+x.dataset.generalStatus].status=x.value;save()});document.querySelectorAll('[data-general-detail]').forEach(x=>x.oninput=()=>{state.decisions[+x.dataset.generalDetail].detail=x.value;save()});el('#generalNotes').oninput=e=>{state.notes.general=e.target.value;save()}}}
function openContractEditor(id){let c=state.contracts.find(x=>x.id===id);if(!c)return;let dialog=document.createElement('dialog');dialog.style.cssText='border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--txt);width:min(880px,96vw);max-height:92vh;overflow:auto;padding:0;box-shadow:0 20px 70px #0006';dialog.innerHTML=`<div class="sectionhead"><div><h2>Editar · ${htmlEscape(c.id)}</h2><p>${htmlEscape(c.title)}</p></div><button class="small" id="cancel">Fechar</button></div><div class="sectionbody"><div class="contractfields"><div><label class="fieldlabel">Método / protocolo</label><input class="fieldinput" id="method" value="${htmlEscape(c.method)}"></div><div><label class="fieldlabel">Endpoint / nome de evento</label><input class="fieldinput" id="path" value="${htmlEscape(c.path)}"></div></div><div style="height:15px"></div><label class="fieldlabel">Situação do contrato</label><select class="fieldinput" id="status">${["Existente (referência)","Proposto","Aprovado","Pendente","Alterado"].map(v=>`<option ${c.status===v?"selected":""}>${htmlEscape(v)}</option>`).join("")}</select><div style="height:12px"></div><div class="contractfields"><div><label class="fieldlabel">Tipo de mudança (independente do status)</label><select class="fieldinput" id="changeKind">${[['existing','Existente sem alteração confirmada'],['new','Novo / Fase 4'],['changed','Contrato alterado']].map(([v,l])=>`<option value="${v}" ${c.changeKind===v?'selected':''}>${l}</option>`).join('')}</select></div><div><label class="fieldlabel">Evidência / fonte</label><input class="fieldinput" id="sourceReference" value="${htmlEscape(c.sourceReference||'')}"></div></div><div style="height:12px"></div><label class="fieldlabel">O que muda? / Justificativa da classificação</label><textarea class="editor" id="changeDescription" rows="2">${htmlEscape(c.changeDescription||'')}</textarea><div style="height:15px"></div><div class="contractgrid"><div><label class="fieldlabel">Request / Payload</label><textarea class="codeedit" id="request">${htmlEscape(c.request)}</textarea><div class="mini muted" id="requestCheck"> </div></div><div><label class="fieldlabel">Response / Processamento</label><textarea class="codeedit" id="response">${htmlEscape(c.response)}</textarea><div class="mini muted" id="responseCheck"> </div></div></div><div style="height:15px"></div><label class="fieldlabel">Erros / Condições</label><textarea class="editor" id="errors">${htmlEscape(c.errors)}</textarea><div style="height:12px"></div><label class="fieldlabel">Observações</label><textarea class="editor" id="notes">${htmlEscape(c.notes||'')}</textarea><div class="editactions"><button id="close" style="margin-right:8px">Cancelar</button><button class="primary" id="apply">Salvar contrato</button></div></div>`;document.body.append(dialog);dialog.showModal();function dismiss(){dialog.close();dialog.remove()}dialog.querySelector('#close').onclick=dismiss;dialog.querySelector('#cancel').onclick=dismiss;dialog.addEventListener('close',()=>dialog.remove());function check(field){let v=dialog.querySelector('#'+field).value.trim(),t=dialog.querySelector('#'+field+'Check');if(!v||(!v.startsWith('{')&&!v.startsWith('['))){t.textContent='Texto ou operação sem JSON';t.className='mini muted';return true}try{JSON.parse(v);t.textContent='✓ JSON válido';t.className='mini success';return true}catch(err){t.textContent='JSON inválido: '+err.message;t.className='mini error';return false}}dialog.querySelector('#request').oninput=()=>check('request');dialog.querySelector('#response').oninput=()=>check('response');check('request');check('response');dialog.querySelector('#apply').onclick=()=>{if(!check('request')||!check('response')){notify('Corrija o JSON inválido antes de salvar');return}for(let f of ['method','path','status','changeKind','sourceReference','changeDescription','request','response','errors','notes'])c[f]=dialog.querySelector('#'+f).value;save();openContracts[c.id]=true;dismiss();render();notify(c.id+' atualizado')}}
el('#themeBtn').onclick=()=>{let d=document.body.dataset.theme==='dark'?'light':'dark';document.body.dataset.theme=d;el('#themeBtn').textContent=d==='dark'?'☀ Modo claro':'☾ Modo escuro';try{localStorage.setItem(key+'-theme',d)}catch(e){}};try{let t=localStorage.getItem(key+'-theme');if(t==='dark'||t==='light'){document.body.dataset.theme=t;el('#themeBtn').textContent=t==='dark'?'☀ Modo claro':'☾ Modo escuro'}}catch(e){}
